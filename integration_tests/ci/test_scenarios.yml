# Only set if not using the default dbt-core/adapter version ranges
# dbt_core_version: ">=1.3.0,<1.12.0"
# dbt_adapter_versions:
#   snowflake: ">=1.3.0,<2.0.0"
#   bigquery: ">=1.3.0,<2.0.0"
#   postgres: ">=1.3.0,<2.0.0"
#   redshift: ">=1.3.0,<2.0.0"
#   databricks: ">=1.6.0,<2.0.0"

schema_variable_name: "openai_schema"

include_databricks_sql: false
include_sqlserver: false
include_duckdb: true
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "Compliance Disabled"
    vars:
      openai__using_compliance_cost: false
      openai__using_compliance_users: false
    include_incremental: false

  - name: "Partial"
    vars:
      openai__using_completion: false
      openai__using_codex_usage_model: false
      openai__using_project: false
      openai__using_project_user_role: false
      openai__using_project_api_key: false
      openai__using_invite: false
    include_incremental: false

  - name: "Passthrough"
    vars:
      openai__cost_passthrough_metrics:
        - name: "start_time"
          alias: "start_time_passthrough_test"
          datatype: "numeric"
      openai__completion_passthrough_metrics:
        - name: "input_token"
          alias: "input_token_passthrough_test"
          datatype: "numeric"
      openai__codex_usage_passthrough_metrics:
        - name: "total_credit"
          alias: "total_credit_passthrough_test"
      openai__codex_usage_model_passthrough_metrics:
        - name: "credit"
          alias: "credit_passthrough_test"
          datatype: "numeric"
      openai__compliance_cost_passthrough_metrics:
        - name: "identity_agent_name"
          alias: "agent_name_passthrough_test"
      openai__compliance_cost_billing_passthrough_metrics:
        - name: "quantity_value"
          alias: "quantity_value_passthrough_test"
          datatype: "numeric"
    include_incremental: false
