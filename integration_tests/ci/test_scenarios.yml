schema_variable_name: "openai_schema"

include_databricks_sql: false
include_sqlserver: false
include_duckdb: true
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "Compliance"
    vars:
      openai_using_compliance_cost: true
      openai_using_compliance_users: true
    include_incremental: false
