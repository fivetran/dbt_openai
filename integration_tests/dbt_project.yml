name: 'openai_integration_tests'
version: '0.1.0'
config-version: 2
profile: 'integration_tests'

vars:
  openai:
    openai_schema: openai_integration_tests
    openai_cost_identifier: "cost"
    openai_completion_identifier: "completion"
    openai_embedding_identifier: "embedding"
    openai_audio_transcription_identifier: "audio_transcription"
    openai_audio_speech_identifier: "audio_speech"
    openai_image_identifier: "image"
    openai_moderation_identifier: "moderation"
    openai_web_search_call_identifier: "web_search_call"
    openai_file_search_call_identifier: "file_search_call"
    openai_codex_usage_identifier: "codex_usage"
    openai_codex_usage_model_identifier: "codex_usage_model"
    openai_project_identifier: "project"
    openai_project_api_key_identifier: "project_api_key"
    openai_users_identifier: "users"
    openai_project_user_identifier: "project_user"
    openai_project_user_role_identifier: "project_user_role"
    openai_project_role_identifier: "project_role"
    openai_users_role_identifier: "users_role"
    openai_groups_identifier: "groups"
    openai_invite_identifier: "invite"

models:
  +persist_docs:
    relation: true
    columns: "{{ false if target.type in ('databricks') else true }}"
  openai:
    +schema: "{{ 'openai_integrations_tests_sqlw' if target.name == 'databricks-sql' else 'openai' }}"

seeds:
  +docs:
    show: False
  openai_integration_tests:
    +column_types:
      _fivetran_synced: timestamp
    cost:
      +column_types:
        start_time: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    completion:
      +column_types:
        input_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        input_cached_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        output_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        num_model_request: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        start_time: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    embedding:
      +column_types:
        input_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        num_model_request: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        start_time: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    audio_transcription:
      +column_types:
        second: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        num_model_request: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        start_time: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    audio_speech:
      +column_types:
        input_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        num_model_request: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        start_time: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    image:
      +column_types:
        num_model_request: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        start_time: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    moderation:
      +column_types:
        input_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        num_model_request: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        start_time: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    web_search_call:
      +column_types:
        num_request: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        num_model_request: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        start_time: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    file_search_call:
      +column_types:
        num_request: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        start_time: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    codex_usage:
      +column_types:
        start_time: timestamp
        total_credit: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        code_attribution_lines_added: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        code_attribution_lines_removed: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        total_thread: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        total_turn: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    codex_usage_model:
      +column_types:
        codex_usage_start_time: timestamp
        credit: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        uncached_text_input_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        cached_text_input_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        text_output_token: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['spark_utils', 'dbt_utils']

flags:
  send_anonymous_usage_stats: False
  use_colors: True
