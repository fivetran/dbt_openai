database_key: openai_database
schema_key: openai_schema

dbt_versions: ">=1.3.0 <3.0.0"

table_variables:
  openai_using_cost:
    - cost
  openai_using_completion:
    - completion
  openai_using_embedding:
    - embedding
  openai_using_audio_transcription:
    - audio_transcription
  openai_using_audio_speech:
    - audio_speech
  openai_using_image:
    - image
  openai_using_moderation:
    - moderation
  openai_using_web_search_call:
    - web_search_call
  openai_using_file_search_call:
    - file_search_call
  openai_using_codex_usage:
    - codex_usage
  openai_using_codex_usage_model:
    - codex_usage_model
  openai_using_project:
    - project
  openai_using_project_api_key:
    - project_api_key
  openai_using_users:
    - users
  openai_using_project_user:
    - project_user
  openai_using_project_user_role:
    - project_user_role
  openai_using_project_role:
    - project_role
  openai_using_users_role:
    - users_role
  openai_using_groups:
    - groups
  openai_using_invite:
    - invite

destination_configurations:
  databricks:
    dispatch:
      - macro_namespace: dbt_utils
        search_order: [ 'spark_utils', 'dbt_utils' ]

public_models: [
  "openai__cost_usage_report",
  "openai__enterprise_user_report",
  "openai__code_report",
  "openai__user_summary"
]

supported_vars:
  openai__cost_passthrough_metrics:
    type: dictionary
    description: "Additional numeric `COST` columns to sum into `openai__cost_usage_report`"
    display_name: "Additional Cost Metrics"

  openai__completion_passthrough_metrics:
    type: dictionary
    description: "Additional numeric `COMPLETION` columns to sum into `openai__cost_usage_report`"
    display_name: "Additional Completion Metrics"

  openai__codex_usage_passthrough_metrics:
    type: dictionary
    description: "Additional `CODEX_USAGE` columns to include in `openai__code_report`"
    display_name: "Additional Codex Usage Columns"

  openai__codex_usage_model_passthrough_metrics:
    type: dictionary
    description: "Additional numeric `CODEX_USAGE_MODEL` columns to sum into `openai__code_report`"
    display_name: "Additional Codex Usage Model Metrics"

  openai__compliance_cost_passthrough_metrics:
    type: dictionary
    description: "Additional `COSTS_ORGANIZATION_LOG` columns to include in `stg_openai__compliance_cost`"
    display_name: "Additional Compliance Cost Columns"

  openai__compliance_cost_billing_passthrough_metrics:
    type: dictionary
    description: "Additional numeric `COSTS_ORGANIZATION_LOG_BILLING` columns to sum into `int_openai__compliance_cost_rollup`"
    display_name: "Additional Compliance Cost Billing Metrics"
