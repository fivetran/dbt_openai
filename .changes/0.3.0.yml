version: 0.3.0
pr_number: 7
schema_data_changes:
  entries:
  - models:
    - '`openai__compliance_cost_report`'
    - '`stg_openai__compliance_cost_billing`'
    change_type: Field value change
    old: '`credits` held USD from 2026-10-10'
    new: '`credits` holds credits only'
    notes: OpenAI switched the Compliance cost log from credits to USD on 2026-10-10.
      `credits` is now null on line items billed in USD.
    is_breaking: true
  - models:
    - '`openai__compliance_cost_report`'
    - '`stg_openai__compliance_cost_billing`'
    change_type: New field
    new: '`cost_usd`'
    notes: Cost of line items billed in USD (from 2026-10-10). Null on line items
      billed in credits.
  - models:
    - '`openai__compliance_cost_report`'
    change_type: New field
    new: '`total_cost_usd`'
    notes: '`cost_usd` plus `credits` priced at the new `openai__credit_rate` variable.
      Only present when that variable is set.'
  - models:
    - '`openai__compliance_cost_report`'
    - '`stg_openai__compliance_cost`'
    change_type: Field value change
    old: '`product` in mixed case (for example `ChatGPT`, `chatgpt`)'
    new: '`product` lowercased'
    notes: OpenAI sent some events from 2026-11-02 with lowercase product names while
      others kept the original casing. Filters on `product` should use lowercase values.
    is_breaking: true
  - models:
    - '`openai__compliance_cost_report`'
    - '`stg_openai__compliance_cost_billing`'
    change_type: Field value change
    old: '`cost_unit` as sent (`CREDITS`, `USD`)'
    new: '`cost_unit` lowercased (`credits`, `usd`)'
    notes: '`cost_unit` is also added to the uniqueness test on `openai__compliance_cost_report`,
      since both units appear on 2026-10-10.'
  - models:
    - '`openai__code_report`'
    change_type: Field value change
    old: '`credits` is 0 when the source reports none'
    new: '`credits` is null when the source reports none'
    notes: The Codex Analytics API stopped returning credits on 2026-10-10. `estimated_cost_amount`
      is also null on those rows. Codex cost from that date is in `openai__compliance_cost_report`
      (products `codex` and `work`).
    is_breaking: true
  - models:
    - '`stg_openai__compliance_cost_billing`'
    change_type: Removed field
    old: '`costs_log_id`'
    notes: The `compliance_costs_organization_log_billing` source table has no `costs_log_id`
      column, so this field was always null.
bug_fixes:
- description: Fixes `openai__compliance_cost_report` returning no rows. Billing lines
    were joined to their cost event on `costs_log_id`, which the billing source table
    doesn't have, so the join matched nothing. Billing now joins on the event alone.
- description: Fixes Compliance cost after 2026-10-10 being reported as credits. OpenAI
    now bills in USD, so cost is split into `credits` and `cost_usd` by `cost_unit`,
    and the two units are never summed together.
- description: Fixes `openai__code_report` showing 0 credits after 2026-10-10, when
    the Codex Analytics API stopped returning credits. These rows now show null.
new_features:
- description: Adds the `openai__credit_rate` variable (USD per credit), which prices
    credits in both `openai__compliance_cost_report` (`total_cost_usd`) and `openai__code_report`
    (`estimated_cost_amount`). It replaces `openai__code_report_credit_rate`, which
    is still read when `openai__credit_rate` isn't set. See the [README](https://github.com/fivetran/dbt_openai/blob/main/README.md#pricing-credits-in-usd).
- description: Documents the Compliance cost log changes in the DECISIONLOG, including
    why rollback events with negative cost are kept, and documents the three SKU name
    formats and how to parse the token type from them.
under_the_hood:
- description: Adds an `accepted_values` test (warn severity) on `cost_unit` in `stg_openai__compliance_cost_billing`,
    so a new cost unit is flagged instead of dropped from both cost columns.
- description: Updates the Compliance seed data to match the connector schema and
    adds USD-era line items, mixed-case and new products, and a rollback and re-issue
    cycle. Adds Codex seed rows with no credits.
- description: Adds the `integrity_compliance_cost_report` validation test, which
    ties `openai__compliance_cost_report` totals to the billing source, and a `Credit
    Rate` test scenario.
date: '2026-11-27'
