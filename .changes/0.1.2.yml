version: 0.1.2
pr_number: 3
schema_data_changes:
  entries:
  - models:
    - "`openai__cost_usage_report`"
    - "`stg_openai__completion`"
    change_type: Changed field/model
    old: '`input_tokens` included cached tokens, causing them to be counted in both
      `input_tokens` and `cache_read_tokens`'
    new: "`input_tokens` equals net uncached input only \u2014 cached tokens appear\
      \ exclusively in `cache_read_tokens`."
    notes: Existing `input_tokens` values decrease for any record that had cached
      tokens.
  - models:
    - "`openai__cost_usage_report`"
    change_type: Changed field/model
    old: Cost line items with a service-tier prefix (e.g. `priority \| gpt-4o, input`,
      `fast mode \| gpt-4o, output`, `evals \| priority \| gpt-4o, output`) kept
      the tier prefix in `model` (e.g. `priority \| gpt-4o`), so their cost never
      matched completion usage. The cost appeared on rows with no token volume, and
      the matching usage appeared as `cost_attribution_method = 'unmatched'` with
      no cost
    new: Tier-prefixed line items now parse to the model name, so their cost and
      usage land on the same row.
  - models:
    - "`openai__cost_usage_report`"
    change_type: Changed field/model
    old: '`model`, `model_family`, and `model_variant` were always null for rows where
      `cost_type = ''other''`, even when the cost line item referenced a specific
      model (e.g. `text-embedding-3-large`, `GPT-4o`, `OpenAI o1`)'
    new: For `cost_type = 'other'` rows, `model`, `model_family`, and `model_variant`
      are now populated if the line item references a model, so these costs can be
      broken down by model. Line items that don't reference a model (e.g. `Assistants
      API`) still leave these fields null.
    notes: Restores model attribution for model-specific charges such as embeddings
      that are billed without a token type.
under_the_hood:
- description: '`service_tier` is carried as an internal join key through `stg_openai__completion`,
    `int_openai__completion_unpivoted`, `int_openai__cost_by_model_day`, and `int_openai__cost_rate_card`
    and aggregated away in `openai__cost_usage_report`, preserving the existing output
    grain and schema.'
date: '2026-10-23'
