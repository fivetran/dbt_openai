version: 0.1.2
pr_number: 3
schema_data_changes:
  entries:
  - models:
    - '`stg_openai__completion`'
    change_type: New field
    new: '`service_tier`'
    notes: Rows without a reported tier default to `default`. Used to match tier-prefixed
      cost line items to completion usage.
bug_fixes:
- description: Fixes cost line items with a service-tier prefix (for example `priority | gpt-4o, input`, 
    `fast mode | gpt-4o, output`, and `evals | priority | gpt-4o, output`) in `openai__cost_usage_report`. 
    The tier prefix stayed in `model`, so cost never matched completion usage. Cost appeared on rows with 
    no token volume, and the matching usage appeared as `unmatched` with no cost. These line items
    now parse to the model name, so cost and usage land on the same row.
- description: Fixes `model`, `model_family`, and `model_variant` being null on `cost_type
    = 'other'` rows in `openai__cost_usage_report` when the line item names a model
    (for example `text-embedding-3-large`, `GPT-4o`, or `OpenAI o1`). Line items without
    a model, such as `Assistants API`, stay null.
- description: Fixes `input_tokens` in `openai__cost_usage_report` double counting
    cached tokens. `input_tokens` may decrease as it now excludes cached tokens, which
    appear only in `cache_read_tokens`.
- description: Allows for negative token values in `openai__cost_usage_report`, as
    OpenAI occasionally reports a negative completion row for adjustment.
under_the_hood:
- description: '`service_tier` is carried as an internal join key through `stg_openai__completion`,
    `int_openai__completion_unpivoted`, `int_openai__cost_by_model_day`, and `int_openai__cost_rate_card`
    and aggregated away in `openai__cost_usage_report`, preserving the existing output
    grain and schema.'
date: '2026-10-27'
