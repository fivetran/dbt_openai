version: 2

models:
  - name: stg_openai__cost
    description: Daily organization-level spend from the OpenAI Costs API. One row per (day, line item).
    columns:
      - name: cost_id
        description: Fivetran-generated unique identifier for this cost record.
        tests:
          - not_null
          - unique
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: line_item
        description: Free-text label identifying what was billed — either "<model>, <unit type>" for model spend, or a feature name for non-model charges.
      - name: cost_amount
        description: "{{ doc('cost_amount') }}"
      - name: currency_code
        description: ISO currency code for `cost_amount`. Always `usd` in practice.
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
        tests:
          - not_null
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__completion
    description: Daily chat/completions token usage from the OpenAI Usage API. One row per (day, project, API key, model).
    columns:
      - name: completion_id
        description: Fivetran-generated unique identifier for this completion record.
        tests:
          - not_null
          - unique
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
      - name: model
        description: "{{ doc('model') }}"
      - name: input_tokens
        description: "{{ doc('input_tokens') }}"
      - name: cache_read_tokens
        description: "{{ doc('cache_read_tokens') }}"
      - name: output_tokens
        description: "{{ doc('output_tokens') }}"
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
        tests:
          - not_null
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__embedding
    description: Daily embeddings token usage from the OpenAI Usage API. One row per (day, project, API key, user, model).
    columns:
      - name: embedding_id
        description: Surrogate key derived from api_key_id, project_id, user_id, model, and the usage bucket start time.
        tests:
          - not_null
          - unique
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
      - name: model
        description: "{{ doc('model') }}"
      - name: input_tokens
        description: "{{ doc('input_tokens') }}"
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
        tests:
          - not_null
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__audio_transcription
    description: Daily speech-to-text (transcription) usage from the OpenAI Usage API. One row per (day, project, API key, user, model).
    columns:
      - name: audio_transcription_id
        description: Surrogate key derived from api_key_id, project_id, user_id, model, and the usage bucket start time.
        tests:
          - not_null
          - unique
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
      - name: model
        description: "{{ doc('model') }}"
      - name: audio_seconds
        description: Seconds of audio transcribed in this usage bucket.
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
        tests:
          - not_null
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__audio_speech
    description: Daily text-to-speech usage from the OpenAI Usage API. One row per (day, project, API key, user, model).
    columns:
      - name: audio_speech_id
        description: Surrogate key derived from api_key_id, project_id, user_id, model, and the usage bucket start time.
        tests:
          - not_null
          - unique
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
      - name: model
        description: "{{ doc('model') }}"
      - name: input_tokens
