version: 2

models:
  - name: stg_openai__cost
    description: Daily organization-level spend from the OpenAI Costs API. One row per (day, line item).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: cost_id
        description: Fivetran-generated unique identifier for this cost record.
        tests:
          - not_null
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: line_item
        description: Free-text label identifying what was billed — either "<model>, <unit type>" for model spend, or a feature name for non-model charges.
      - name: cost_amount
        description: "{{ doc('cost_amount') }}"
      - name: currency_code
        description: ISO currency code for `cost_amount`. Always `usd` in practice.
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__completion
    description: Daily chat/completions token usage from the OpenAI Usage API. One row per (day, project, API key, model).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: completion_id
        description: Fivetran-generated unique identifier for this completion record.
        tests:
          - not_null
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
      - name: model
        description: "{{ doc('model') }}"
      - name: input_tokens
        description: "{{ doc('input_tokens') }}"
      - name: cache_read_tokens
        description: "{{ doc('cache_read_tokens') }}"
      - name: output_tokens
        description: "{{ doc('output_tokens') }}"
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__embedding
    description: Daily embeddings token usage from the OpenAI Usage API. One row per (day, project, API key, user, model).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: project_id
        description: "{{ doc('project_id') }}"
        tests:
          - not_null
      - name: user_id
        description: "{{ doc('user_id') }}"
        tests:
          - not_null
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
        tests:
          - not_null
      - name: model
        description: "{{ doc('model') }}"
        tests:
          - not_null
      - name: input_tokens
        description: "{{ doc('input_tokens') }}"
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
        tests:
          - not_null
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__audio_transcription
    description: Daily speech-to-text (transcription) usage from the OpenAI Usage API. One row per (day, project, API key, user, model).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: project_id
        description: "{{ doc('project_id') }}"
        tests:
          - not_null
      - name: user_id
        description: "{{ doc('user_id') }}"
        tests:
          - not_null
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
        tests:
          - not_null
      - name: model
        description: "{{ doc('model') }}"
        tests:
          - not_null
      - name: audio_seconds
        description: Seconds of audio transcribed in this usage bucket.
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
        tests:
          - not_null
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__audio_speech
    description: Daily text-to-speech usage from the OpenAI Usage API. One row per (day, project, API key, user, model).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: project_id
        description: "{{ doc('project_id') }}"
        tests:
          - not_null
      - name: user_id
        description: "{{ doc('user_id') }}"
        tests:
          - not_null
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
        tests:
          - not_null
      - name: model
        description: "{{ doc('model') }}"
        tests:
          - not_null
      - name: input_tokens
        description: "{{ doc('input_tokens') }}"
      - name: characters
        description: Number of characters synthesized in this usage record.
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
        tests:
          - not_null
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__image
    description: Daily image generation usage from the OpenAI Usage API. One row per (day, project, API key, user, model).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: image_id
        description: Fivetran-generated unique identifier for this image usage record.
        tests:
          - not_null
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
      - name: model
        description: "{{ doc('model') }}"
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__moderation
    description: Daily content-moderation usage from the OpenAI Usage API. One row per (day, project, API key, user, model).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: moderation_id
        description: Fivetran-generated unique identifier for this moderation usage record.
        tests:
          - not_null
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
      - name: model
        description: "{{ doc('model') }}"
      - name: input_tokens
        description: "{{ doc('input_tokens') }}"
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__web_search_call
    description: Daily web search tool call usage from the OpenAI Usage API. One row per (day, project, API key, user, model).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: web_search_call_id
        description: Fivetran-generated unique identifier for this web search call record.
        tests:
          - not_null
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
      - name: model
        description: "{{ doc('model') }}"
      - name: num_requests
        description: "{{ doc('num_requests') }}"
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__file_search_call
    description: Daily file/vector store search tool call usage from the OpenAI Usage API. One row per (day, project, API key, user). This endpoint does not report a model.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: file_search_call_id
        description: Fivetran-generated unique identifier for this file search call record.
        tests:
          - not_null
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
      - name: num_requests
        description: "{{ doc('num_requests') }}"
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__codex_usage
    description: Daily Codex Enterprise usage per person — parent record carrying the actor's email and day-level productivity totals. One row per (day, user).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
        tests:
          - not_null
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
        tests:
          - not_null
      - name: actor_email
        description: "{{ doc('actor_email') }}"
      - name: code_attribution_lines_added
        description: Total lines of code added via Codex-attributed commits for this person on this day.
      - name: code_attribution_lines_removed
        description: Total lines of code removed via Codex-attributed commits for this person on this day.
      - name: total_threads
        description: Total Codex conversation threads started by this person on this day.
      - name: total_turns
        description: Total Codex conversation turns by this person on this day.
      - name: credits
        description: "{{ doc('credits') }} This is the day-level total across every model/speed this person used, independent of `stg_openai__codex_usage_model`'s finer breakdown."
      - name: input_tokens
        description: "{{ doc('input_tokens') }} Day-level total, independent of `stg_openai__codex_usage_model`'s finer breakdown."
      - name: cache_read_tokens
        description: "{{ doc('cache_read_tokens') }} Day-level total, independent of `stg_openai__codex_usage_model`'s finer breakdown."
      - name: output_tokens
        description: "{{ doc('output_tokens') }} Day-level total, independent of `stg_openai__codex_usage_model`'s finer breakdown."
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__codex_usage_model
    description: Per-model, per-speed breakdown of Codex Enterprise credit and token usage. One row per (day, user, model, speed). Child of `stg_openai__codex_usage`.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
        tests:
          - not_null
      - name: usage_started_at
        description: "{{ doc('usage_started_at') }}"
        tests:
          - not_null
      - name: model
        description: "{{ doc('model') }}"
      - name: speed
        description: Codex processing tier for this usage — `standard` or `fast` (the 2.5x priority tier).
      - name: credits
        description: "{{ doc('credits') }}"
      - name: input_tokens
        description: "{{ doc('input_tokens') }}"
      - name: cache_read_tokens
        description: "{{ doc('cache_read_tokens') }}"
      - name: output_tokens
        description: "{{ doc('output_tokens') }}"
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__project
    description: OpenAI Platform projects within the organization. One row per project.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: project_id
        description: "{{ doc('project_id') }}"
        tests:
          - not_null
      - name: project_name
        description: Display name of the project.
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__project_api_key
    description: API keys scoped to an OpenAI Platform project — the keys referenced by `api_key_id` on the usage and cost tables.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: api_key_id
        description: "{{ doc('api_key_id') }}"
        tests:
          - not_null
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: user_id
        description: "{{ doc('user_id') }} Populated when `owner_type` is `user`; null when the key is owned by a service account."
      - name: owner_type
        description: Type of principal that owns the key — `user` or `service_account`.
      - name: api_key_name
        description: Display name given to the API key when it was created.
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__users
    description: Organization-level users in the OpenAI Platform account. One row per user.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
        tests:
          - not_null
      - name: email
        description: Email address of the user.
      - name: user_name
        description: Display name of the user.
      - name: user_role
        description: Organization-level role of the user (e.g. `owner`, `reader`).
      - name: _fivetran_deleted
        description: Whether the user has been removed from the organization. Not filtered out of this model — see the package description for why.
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__project_user
    description: Membership records linking users to the OpenAI Platform projects they belong to.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
        tests:
          - not_null
      - name: project_id
        description: "{{ doc('project_id') }}"
        tests:
          - not_null
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__project_user_role
    description: Custom role assigned to a user within a specific OpenAI Platform project.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: project_role_assignment_id
        description: Identifier for this project-level role assignment. Not unique on its own, even within a single connection — the same role ID can recur across different (project, assignee) combinations.
        tests:
          - not_null
      - name: project_id
        description: "{{ doc('project_id') }}"
      - name: project_user_id
        description: Foreign key to `stg_openai__project_user.user_id` — the project membership this role assignment applies to.
      - name: role_name
        description: Name of the custom role assigned within the project.
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__users_role
    description: Organization-level permission role assigned to a user. One row per (user, role).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: user_role_id
        description: Identifier for this organization-level role assignment. Not unique on its own, even within a single connection — the same role ID can recur across different users.
        tests:
          - not_null
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: role_name
        description: Name of the organization-level permission role.
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__invite
    description: Pending and historical invitations to join the organization. One row per invite.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: invite_id
        description: Identifier for the invite.
        tests:
          - not_null
      - name: email
        description: Email address the invite was sent to.
      - name: invited_role
        description: Organization-level role the invitee will receive upon accepting.
      - name: invite_status
        description: Current status of the invite (e.g. `pending`, `accepted`, `expired`).
      - name: invited_at
        description: Timestamp the invite was sent.
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__compliance_cost
    description: One row per (event, log file) snapshot of a compliance cost event — not one row per event, since a still-open event is re-emitted with a cumulative count in every log file until its hour closes. See openai__compliance_cost_report for how the correct (newest) snapshot is picked.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: event_id
        description: Identifier for a cost event. Not unique on its own — see the model description.
      - name: organization_id
        description: ChatGPT Enterprise organization identifier.
      - name: costs_log_id
        description: Identifier of the log file this snapshot of the event came from.
      - name: event_type
        description: The compliance log event type (always COSTS for this model).
      - name: date_day
        description: "{{ doc('date_day') }}"
      - name: hour
        description: Hour of day (0-23) the event occurred in.
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: product
        description: The ChatGPT Enterprise product this spend belongs to.
      - name: surface
        description: The surface the spend originated from.
      - name: client
        description: The client application used.
      - name: model
        description: "{{ doc('model') }}"
      - name: service_tier
        description: The service tier the request was billed under.
      - name: reasoning
        description: The reasoning effort level used, if applicable to the model.
      - name: input_tokens
        description: "{{ doc('input_tokens') }}"
      - name: cache_read_tokens
        description: "{{ doc('cache_read_tokens') }}"
      - name: output_tokens
        description: "{{ doc('output_tokens') }}"
      - name: image_output_tokens
        description: Count of image output tokens generated for this event.
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__compliance_cost_billing
    description: One row per (SKU line item, log file) snapshot billed against a compliance cost event — restated per log file like its parent, so also carries costs_log_id.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: event_id
        description: Identifier for the parent cost event.
      - name: organization_id
        description: ChatGPT Enterprise organization identifier.
      - name: costs_log_id
        description: Identifier of the log file this billing snapshot came from.
      - name: sku
        description: The billed SKU.
      - name: quantity_unit
        description: The unit `quantity` is denominated in. Only additive within a single unit.
      - name: quantity
        description: Quantity consumed, in the unit named by `quantity_unit`.
      - name: cost_unit
        description: The unit `credits` is denominated in (typically credits).
      - name: credits
        description: "{{ doc('credits') }}"
      - name: estimated_cost_usd_amount
        description: Connector-estimated USD equivalent of `credits`, provided directly by the source.
      - name: estimated_cost_usd_currency
        description: ISO currency code for `estimated_cost_usd_amount`.
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__compliance_costs_log_file
    description: Catalog of the log files OpenAI delivers the Compliance cost log in. Purely infrastructure for openai__compliance_cost_report's restatement dedup — not intended to be queried on its own.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: costs_log_id
        description: Identifier for the log file.
      - name: organization_id
        description: ChatGPT Enterprise organization identifier.
      - name: end_time
        description: "{{ doc('usage_ended_at') }}"
      - name: file_name
        description: Name of the log file.
      - name: file_size
        description: Size of the log file, in bytes.
      - name: file_sha256
        description: SHA-256 checksum of the log file.
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"

  - name: stg_openai__compliance_users
    description: "One row per ChatGPT workspace user, including offboarded users so historical spend stays attributable."
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: workspace_id
        description: Identifier for the ChatGPT workspace this user belongs to.
      - name: email
        description: "{{ doc('email') }}"
      - name: user_name
        description: The user's display name.
      - name: user_role
        description: The user's role within the workspace.
      - name: user_status
        description: The user's account status (for example, active or offboarded).
      - name: created_at
        description: Timestamp the user was created.
      - name: _fivetran_synced
        description: "{{ doc('fivetran_synced') }}"
