version: 2

models:
  - name: openai__cost_usage_report
    description: >
      Daily OpenAI Platform spend and token usage by project, model, and token_unit_type, plus
      an org-level `cost_type = 'other'` row for cost not tied to a project or model — kept so
      `sum(openai_cost)` always ties to the source `cost` table. `cost_attribution_method` marks
      how `openai_cost` was determined for `tokens` rows: `direct` (Costs API-reported),
      `allocated` (inferred via an implied per-token rate), `unallocated`, or `unmatched` (cost
      exists with no completion volume to allocate against, or vice versa). Still useful with
      only the `cost` or only the `completion` table synced — see column descriptions for what drops.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: date_day
        description: "{{ doc('date_day') }}"
        tests:
          - not_null
      - name: project_id
        description: "{{ doc('project_id') }} Null on `other`-cost_type rows that couldn't be tied to a project."
      - name: project_name
        description: "{{ doc('project_name') }} Only present when the `project` table is synced. Null wherever project_id is null."
      - name: model
        description: "{{ doc('model') }} Null on `other`-cost_type rows, which don't break out by model."
      - name: model_family
        description: "{{ doc('model_family') }} Null on `other`-cost_type rows."
      - name: model_variant
        description: "{{ doc('model_variant') }} Null on `other`-cost_type rows."
      - name: token_unit_type
        description: "`input`, `cache_read`, `output`, or `cache_write` — the kind of token this row's usage and/or cost belongs to. Null on `other`-cost_type rows, which don't break out by token type."
      - name: token_quantity
        description: Number of tokens of `token_unit_type` metered for this row. Null on `other`-cost_type rows and on `cache_write` rows, since the Completions API doesn't report cache-write token volume. Only present when the `completion` table is synced.
      - name: cost_type
        description: >
          `tokens` for spend attributed to a model and token_unit_type, or `other` for cost that
          doesn't break out by model (e.g. "Assistants API"). Only present when the `cost` table
          is synced.
      - name: cost_attribution_method
        description: >
          How `openai_cost` was determined: `direct` (Costs API-reported), `allocated`
          (inferred via rate card), `unallocated`, or `unmatched` (cost with no completion volume
          to allocate against, or completion volume with no cost data at all). Only present when
          the `cost` table is synced.
      - name: num_model_requests
        description: "{{ doc('num_model_requests') }} Only present when the `completion` table is synced."
      - name: openai_cost
        description: "{{ doc('openai_cost') }} Only present when the `cost` table is synced."
      - name: currency
        description: Currency code for `openai_cost`, as reported by the Costs API (in practice always `usd`). Only present when the `cost` table is synced.

  - name: openai__enterprise_user_report
    description: >
      Daily OpenAI Platform activity by user, project, model, and product — completions,
      embeddings, audio, image, moderation, web search, and file search. Cost isn't available
      at this grain; the Costs endpoint doesn't report per-user attribution.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: date_day
        description: "{{ doc('date_day') }}"
        tests:
          - not_null
      - name: actor_user_id
        description: "{{ doc('actor_user_id') }}"
      - name: actor_email
        description: "{{ doc('actor_email') }}"
      - name: project_id
        description: "{{ doc('project_id') }} Null for products that don't report a project_id."
      - name: project_name
        description: "{{ doc('project_name') }} Only present when the `project` table is synced."
      - name: model
        description: "{{ doc('model') }}"
      - name: model_family
        description: "{{ doc('model_family') }}"
      - name: model_variant
        description: "{{ doc('model_variant') }}"
      - name: product
        description: OpenAI product this activity came from — `completion`, `embedding`, `audio_transcription`, `audio_speech`, `image`, `moderation`, `web_search`, or `file_search`.
      - name: quantity
        description: Amount consumed, in the unit named by `quantity_unit`. Only additive within a single unit — null for products with no comparable single-request measure (`image`, `web_search`, `file_search`).
      - name: quantity_unit
        description: Unit `quantity` is denominated in — `tokens` (`completion`, `embedding`, `moderation`), `seconds` (`audio_transcription`), `characters` (`audio_speech`), or null.
      - name: num_model_requests
        description: Model requests for model products; tool-call counts (`num_requests`) for `web_search` and `file_search`, which may not map 1:1 to a model request.

  - name: openai__code_report
    description: >
      Daily Codex Enterprise productivity by person. Per-model/speed detail rolls up onto this
      grain rather than fanning out. Credits/tokens come from `codex_usage` when enabled, else
      a `codex_usage_model` rollup — either table alone is still useful; see column descriptions
      for what drops when one is disabled.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: date_day
        description: "{{ doc('date_day') }}"
        tests:
          - not_null
      - name: user_id
        description: "{{ doc('user_id') }}"
        tests:
          - not_null
      - name: actor_email
        description: "{{ doc('actor_email') }} Only present when the `codex_usage` table is synced."
      - name: count_lines_of_code_added
        description: Lines of code added via Codex-attributed commits for this person on this day. Only present when the `codex_usage` table is synced.
      - name: count_lines_of_code_removed
        description: Lines of code removed via Codex-attributed commits for this person on this day. Only present when the `codex_usage` table is synced.
      - name: count_threads
        description: Codex conversation threads started by this person on this day. Only present when the `codex_usage` table is synced.
      - name: count_turns
        description: Codex conversation turns by this person on this day. Only present when the `codex_usage` table is synced.
      - name: count_models_used
        description: Distinct Codex models this person used on this day. Only present when the `codex_usage_model` table is synced.
      - name: credits
        description: "{{ doc('credits') }} From `codex_usage` when enabled, else rolled up from `codex_usage_model`."
      - name: input_tokens
        description: "{{ doc('input_tokens') }} From `codex_usage` when enabled, else rolled up from `codex_usage_model`."
      - name: cache_read_tokens
        description: "{{ doc('cache_read_tokens') }} From `codex_usage` when enabled, else rolled up from `codex_usage_model`."
      - name: output_tokens
        description: "{{ doc('output_tokens') }} From `codex_usage` when enabled, else rolled up from `codex_usage_model`."

  - name: openai__user_summary
    description: >
      One row per source relation and OpenAI Platform user, with organization role, project
      membership, project-level custom roles, and all-time and month-to-date usage totals.
      Several column groups are entirely omitted (not nulled) when their source table is
      disabled — see each column's description.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: actor_user_id
        description: "{{ doc('actor_user_id') }}"
        tests:
          - not_null
      - name: email
        description: "{{ doc('email') }}"
      - name: name
        description: Display name of the user.
      - name: role
        description: Organization-level role of the user (e.g. `owner`, `reader`).
      - name: is_user_deleted
        description: Whether the user has been removed from the organization. `users` isn't filtered on this — see the DECISIONLOG — so an offboarded user's historical usage stays attributed instead of disappearing; this column is how you tell current members from offboarded ones.
      - name: org_permission_roles
        description: Comma-separated list of organization-level permission roles assigned to the user. Only present when the `users_role` table is synced.
      - name: project_count
        description: Number of OpenAI Platform projects this user belongs to. Only present when the `project_user` table is synced.
      - name: project_names
        description: Comma-separated list of project names this user belongs to. Only present when both the `project_user` and `project` tables are synced.
      - name: project_role_count
        description: Number of distinct custom project-level roles assigned to this user across all their projects. Only present when the `project_user_role` table is synced.
      - name: project_role_names
        description: Comma-separated list of distinct custom project-level role names assigned to this user. Only present when the `project_user_role` table is synced.
      - name: api_key_count
        description: Number of project-scoped API keys owned by this user (excludes keys owned by a service account). Only present when the `project_api_key` table is synced.
      - name: latest_invite_status
        description: Status of this user's most recent invite (for example, `pending`, `accepted`, or `expired`), matched by email. Null if no invite record matches this user's email — for example, an organization owner added before the invite flow was used. Only present when the `invite` table is synced.
      - name: latest_invited_at
        description: Timestamp of this user's most recent invite, matched by email. Only present when the `invite` table is synced.
      - name: lifetime_tokens
        description: Tokens consumed across every product covered by `openai__enterprise_user_report`. All time.
      - name: month_to_date_tokens
        description: Tokens consumed across every product covered by `openai__enterprise_user_report`. Current calendar month only.
      - name: lifetime_num_model_requests
        description: Model/tool requests across every product covered by `openai__enterprise_user_report`. All time.
      - name: month_to_date_num_model_requests
        description: Model/tool requests across every product covered by `openai__enterprise_user_report`. Current calendar month only.
      - name: lifetime_active_days
        description: Distinct days the user recorded product activity, all time.
      - name: month_to_date_active_days
        description: Distinct days the user recorded product activity this calendar month.
      - name: first_active_date
        description: Earliest day the user recorded product activity.
      - name: last_active_date
        description: Most recent day the user recorded product activity.

  - name: openai__compliance_cost_report
    description: >
      Daily ChatGPT Enterprise (Compliance Platform) spend by user, product, surface, model, and
      SKU. Only its `codex`-product rows cover the same activity as `openai__code_report` — and
      from a cost angle, not that report's productivity angle — so summing spend across both
      reports double-counts Codex. Each cost event is re-emitted with a cumulative count in every
      log file covering its still-open hour; this model keeps only the newest snapshot per event.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: organization_id
        description: ChatGPT Enterprise organization identifier.
      - name: date_day
        description: "{{ doc('date_day') }}"
        tests:
          - not_null
      - name: user_id
        description: "{{ doc('user_id') }}"
      - name: email
        description: "{{ doc('email') }} Only present when the `compliance_users` table is synced."
      - name: product
        description: The ChatGPT Enterprise product this spend belongs to (e.g. `chat`, `image`, `codex`).
      - name: surface
        description: The surface the spend originated from.
      - name: client
        description: The client application used.
      - name: model
        description: "{{ doc('model') }}"
      - name: service_tier
        description: The service tier the request was billed under.
      - name: reasoning
        description: The reasoning effort level used, if applicable to the model.
      - name: sku
        description: The billed SKU.
      - name: quantity_unit
        description: The unit `quantity` is denominated in (for example, tokens, counts, duration_s, hours, gib_hours). Only additive within a single unit.
      - name: cost_unit
        description: The unit `credits` is denominated in (typically credits).
      - name: quantity
        description: Quantity consumed, in the unit named by `quantity_unit`.
      - name: credits
        description: "{{ doc('credits') }}"
      - name: estimated_cost_usd_amount
        description: Connector-estimated USD equivalent of `credits`, provided directly by the source.
      - name: estimated_cost_usd_currency
        description: ISO currency code for `estimated_cost_usd_amount`.
